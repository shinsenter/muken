# Builds, scans and publishes a release when a tag such as v0.1.0 is pushed.
# The release job needs the scan, so a tag with a known fixable CVE publishes nothing.
# Each file is signed with cosign (keyless): the certificate names this workflow and the tag.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          # The newest Go: older ones stop getting security fixes. go.mod keeps the oldest version that can build the code.
          go-version: stable
          cache: false

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          make dist VERSION="$TAG"
          cd dist
          sha256sum muken-* | tee checksums.txt

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  scan-binaries:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          # The newest Go: older ones stop getting security fixes. go.mod keeps the oldest version that can build the code.
          go-version: stable
          cache: false

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # The binary carries the Go standard library, so it can have a CVE that the source scan cannot see.
      - name: govulncheck on the binaries
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          {
            echo '### govulncheck, binaries'
            echo '```'
            for file in dist/muken-*; do
              echo "== $file"
              "$(go env GOPATH)/bin/govulncheck" -mode=binary "$file"
            done
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    needs: [scan-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: sigstore/cosign-installer@v4.1.3

      - name: Sign
        run: |
          for file in dist/muken-*; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          [[ $TAG == *-* ]] && flags+=(--prerelease)
          cat > notes.md <<NOTES
          muken ${TAG}. Guide: https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/guide.md

          Check a download:

              sha256sum --check --ignore-missing checksums.txt
              cosign verify-blob --bundle muken-linux-amd64.sigstore.json \\
                --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}" \\
                --certificate-oidc-issuer https://token.actions.githubusercontent.com muken-linux-amd64

          Run \`muken version --license\` for the license, the notices and the name policy.
          NOTES
          gh release create "$TAG" dist/* "${flags[@]}" --title "muken ${TAG}" --notes-file notes.md --verify-tag
